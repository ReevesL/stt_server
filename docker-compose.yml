services:
  stt-server:
    image: ghcr.io/reevesl/stt_server:1.5.1
    ports:
      - "8001:8000"
    environment:
      - HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxx
      - OMP_NUM_THREADS=14
      - MAX_WORKERS=1
      - ARCHIVE_PATH=/mnt/stt_files
      - RETENTION_DAYS=2
      - WEBHOOK_URL=
      - WEBHOOK_ENABLED=false
      - WEBHOOK_USERNAME=
      - WEBHOOK_PASSWORD=
    volumes:
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - transcripts:/app/transcripts
      - /mnt/stor3/stt_files:/mnt/stt_files
    restart: unless-stopped

volumes:
  hf_cache:
  torch_cache:
  transcripts:
